name: Pages

# Publica a pasta site/ (os paineis gerados com dados ficticios).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A mesma varredura do CI, antes de qualquer byte ir para a web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Varredura de dados pessoais
        run: python tools/varredura_pii.py --generica

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
