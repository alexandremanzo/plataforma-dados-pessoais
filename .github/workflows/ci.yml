name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lint leve: so erros de verdade (sintaxe, nome indefinido, import
      # quebrado), sem impor estilo a um codigo que ja tem o seu.
      - name: Lint (ruff)
        run: |
          pip install ruff==0.6.9
          ruff check --select E9,F63,F7,F82 .

      - name: Compila todos os .py
        run: python -m compileall -q scripts airflow powerbi tools demo

      # Camada generica da varredura: CPF, CNPJ, e-mail, telefone,
      # caminhos locais e segredos. A lista privada de termos so existe
      # na maquina do autor e nao roda aqui.
      - name: Varredura de dados pessoais
        run: python tools/varredura_pii.py --generica
